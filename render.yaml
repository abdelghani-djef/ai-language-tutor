# Render Blueprint: LinguaCards is a fully static site (no server, no database),
# so it deploys as a Render static site served from their CDN.
services:
  - type: web
    runtime: static
    name: linguacards
    # Install scripts only fetch native Node binaries (onnxruntime-node etc.); the
    # models run in the browser, so the build doesn't need them.
    buildCommand: npm ci --ignore-scripts && npm run build
    staticPublishPath: ./out
    autoDeployTrigger: commit
    headers:
      # Every file under _next/static has a content hash in its name, so it can be cached forever.
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
